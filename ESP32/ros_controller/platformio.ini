; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html



[env:esp32-s3-wroom-wifi]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

;board_build.filesystem = spiffs  ; Changed from littlefs
;board_build.partitions = default.csv
;board_build.filesystem = littlefs
;board_build.partitions = partitions.csv

; ESP32-S3-N16R8 configuration
;board_build.arduino.memory_type = opi_opi
;board_build.flash_mode = qio
;board_upload.flash_size = 16MB
;board_build.psram_type = opi
;board_build.partitions = partitions_16MB.csv

monitor_speed = 115200

; ESP32-S3 specific build flags
;board_build.arduino.memory_type = qio_opi
;board_build.flash_mode = qio

lib_deps =
;    https://github.com/micro-ROS/micro_ros_platformio
;    https://github.com/nicolas-beaufort/micro_ros_platformio
    https://github.com/AvansMechatronica/micro_ros_platformio
    WiFi
    ottowinter/ESPAsyncWebServer-esphome@^3.3.0
;    ESP32Async/ESPAsyncWebServer
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
;    jrowberg/I2Cdevlib-MPU6050@^1.0.0
;    jrowberg/I2Cdevlib-Core@^1.0.1
    https://github.com/electroniccats/mpu6050.git
    


build_flags = 
  -DWIFI
  -DDEBUG
  -DHANDLE_BUMPERS
;  -DARDUINO_USB_CDC_ON_BOOT=1
;  -DINCLUDE_IMU
;  -DINCLUDE_LIDAR
  -DLIDAR_INVERT_SCAN
  -DLIDAR_ANGLE_OFFSET=90
  -DIGNOR_TFT_PRINT
  -DUSE_SPIFFS
;  -DCONFIG_LITTLEFS_FOR_IDF_3_2
;  -DCONFIG_LITTLEFS_MULTIVERSION
;  -DBOARD_HAS_PSRAM
;  -DCONFIG_SPIRAM_CACHE_WORKAROUND
;  -DCONFIG_ESP_COREDUMP_ENABLE_TO_NONE=1

board_microros_transport = wifi

; Force erase flash on upload to fix filesystem
;upload_flags = 
;  --erase-all

[env:esp32-s3-wroom-usb]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
lib_deps =
;    https://github.com/micro-ROS/micro_ros_platformio
;    https://github.com/nicolas-beaufort/micro_ros_platformio
    https://github.com/AvansMechatronica/micro_ros_platformio
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3

build_flags =
;    -DHANDLE_BUMPERS
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DINCLUDE_IMU
    -DLIDAR_INVERT_SCAN
    -DLIDAR_ANGLE_OFFSET=90


board_microros_transport = serial