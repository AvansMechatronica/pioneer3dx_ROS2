; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html



[env:esp32-s3-wroom-wifi]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.filesystem = littlefs


;board_build.partitions = default_8MB.csv
;board_build.memory_type = qio_opi
monitor_speed = 115200


lib_deps =
;    https://github.com/micro-ROS/micro_ros_platformio
;    https://github.com/nicolas-beaufort/micro_ros_platformio
    https://github.com/AvansMechatronica/micro_ros_platformio
    WiFi
;    ottowinter/ESPAsyncWebServer-esphome@^3.3.0
    ESP32Async/ESPAsyncWebServer
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
;    jrowberg/I2Cdevlib-MPU6050@^1.0.0
;    jrowberg/I2Cdevlib-Core@^1.0.1
    https://github.com/electroniccats/mpu6050.git
    
    


build_flags = 
; Enable WiFi
  -DWIFI 
;
  -DNETWORK_CONFIG_DEBUG
; Enable native USB CDC serial on ESP32-S3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
; Enable TFT print for WiFi status
  -DWIFI_INCLUDE_TFT_PRINT
; Enable general debugging
  -DDEBUG 
; Enable motor controller debug
;  -DDEBUG_MOTOR_CONTROLLER 
; Enable multiple executors for publishers
  -DMULTIPLE_PUBLISH_EXECUTORS
; Enable bumper handling 
  -DHANDLE_BUMPERS 
; Enable LIDAR
  -DINCLUDE_LIDAR
; Enable LIDAR debug
;  -DDEBUG_LIDAR
; Invert LIDAR scan
  -DLIDAR_INVERT_SCAN 
; LIDAR angle offset
  -DLIDAR_ANGLE_OFFSET=-90 
; Set core debug level to maximum
  -DCORE_DEBUG_LEVEL=5
; Enable IMU
  -DINCLUDE_IMU
; Enable IMU debug
  -DDEBUG_IMU
; Enable IMU acquisition debug
;  -DDEBUG_IMU_AQUISITION


; Use WiFi transport for micro-ROS
board_microros_transport = wifi 
; Decode exceptions
;monitor_filters = esp32_exception_decoder 


[env:esp32-s3-wroom-usb]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
lib_deps =
;    https://github.com/micro-ROS/micro_ros_platformio
;    https://github.com/nicolas-beaufort/micro_ros_platformio
    https://github.com/AvansMechatronica/micro_ros_platformio
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3

build_flags =
;    -DHANDLE_BUMPERS
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DINCLUDE_IMU
    -DLIDAR_INVERT_SCAN
    -DLIDAR_ANGLE_OFFSET=90


board_microros_transport = serial